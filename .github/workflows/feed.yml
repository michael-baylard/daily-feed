name: feed

# :05 past every hour. A live Twitch login posts once an hour.
# News waits until 3pm America/Chicago, and only when the source changed.
on:
  workflow_dispatch:
    inputs:
      repost:
        description: Post this week's stories again
        type: boolean
        default: false
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: feed-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - name: Post the feed
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ -z "$XAI_API_KEY" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Add XAI_API_KEY and DISCORD_WEBHOOK_URL under Settings, Secrets and variables, Actions."
            exit 1
          fi
          mkdir -p inbox
          extra=""
          if [ "${{ inputs.repost }}" = "true" ]; then
            extra="--repost"
          fi
          uv run daily-feed run \
            --watchlist config/watchlist.example.yaml \
            --state state.json \
            --inbox inbox \
            $extra
      - name: Remember what was posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          git diff --cached --quiet && exit 0
          git commit -m "Remember what was posted."
          git push
